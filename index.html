<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Portfolio ni Piodos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .welcome-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .welcome-message {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 192, 203, 0.5);
            max-width: 600px;
            margin-bottom: 30px;
        }

        .welcome-message h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: pink;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .welcome-message p {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .proceed-button {
            background-color: pink;
            color: black;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 192, 203, 0.4);
        }

        .proceed-button:hover {
            background-color: #ffb6c1;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 192, 203, 0.6);
        }

        .proceed-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="welcome-container">
        <div class="welcome-message">
            <h1>Welcome!</h1>
            <p>Welcome to the Portfolio ni Piodos</p>
            <p>Explore my projects, skills, and journey as an IT student.</p>
            <a href="home.html" class="proceed-button">Enter Portfolio</a>
        </div>
    </div>
</body>

</html>
